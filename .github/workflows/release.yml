name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build release
        run: cargo build --release

      - name: Get version
        id: version
        run: echo "version=v0.1.0" >> $env:GITHUB_OUTPUT

      - name: Create Tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v0.1.0';
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
              console.log(`Created tag ${tag}`);
            } catch (e) {
              console.log(`Tag ${tag} may already exist: ${e.message}`);
            }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_exist: false
          files: target/release/sspin.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
